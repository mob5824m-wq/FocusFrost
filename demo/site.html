<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simulated tab</title>
  <style>
    :root { --ink: #0b0f18; --line: rgba(20, 30, 50, 0.09); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .logo {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 14px;
      background: var(--brand, #444);
      flex: none;
    }
    .who { display: flex; flex-direction: column; line-height: 1.2; }
    .who b { font-size: 13px; }
    .who span { font-size: 11px; color: #7a879c; font-family: ui-monospace, Menlo, monospace; }
    .fake-flag {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8592a8;
      border: 1px dashed #cdd6e4;
      border-radius: 999px;
      padding: 4px 9px;
    }
    .wrap { display: grid; grid-template-columns: 190px 1fr 200px; gap: 22px; padding: 20px; flex: 1; }
    .side { display: flex; flex-direction: column; gap: 9px; }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      font-size: 12.5px; font-weight: 600; color: #46536b;
      padding: 7px 9px; border-radius: 9px; background: #f4f6fa;
    }
    .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--brand, #888); opacity: 0.55; flex: none; }
    .feed { display: flex; flex-direction: column; gap: 14px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 18px -14px rgba(10, 20, 40, 0.5);
    }
    .card-head { display: flex; align-items: center; gap: 9px; padding: 11px 13px; }
    .avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #dbe4f3, #c3d0e6); flex: none; }
    .sk { height: 9px; border-radius: 5px; background: #eef1f7; }
    .sk.w60 { width: 60%; } .sk.w40 { width: 40%; } .sk.w80 { width: 80%; }
    .thumb { height: 130px; background: linear-gradient(120deg, #eef2f9, #e2e9f5 60%, #dbe4f3); }
    .card-body { padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; }
    .right-col { display: flex; flex-direction: column; gap: 10px; }
    .module { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fbfcfe; }
    .module b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8592a8; }
    .foot {
      padding: 10px 16px; border-top: 1px solid var(--line);
      font-size: 11px; color: #93a0b5; display: flex; gap: 8px; align-items: center;
    }
    .foot code { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; background: #f1f4f9; padding: 2px 6px; border-radius: 5px; }
    @media (max-width: 780px) { .wrap { grid-template-columns: 1fr; } .side, .right-col { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="logo" id="logo">Y</div>
    <div class="who">
      <b id="name">Simulated site</b>
      <span id="host">example.com</span>
    </div>
    <div class="fake-flag">simulated tab</div>
  </div>

  <div class="wrap">
    <div class="side" id="side"></div>

    <div class="feed" id="feed"></div>

    <div class="right-col">
      <div class="module">
        <b>Trending</b>
        <div class="sk w80"></div><div class="sk w60"></div><div class="sk w80"></div><div class="sk w40"></div>
      </div>
      <div class="module">
        <b>People</b>
        <div class="sk w60"></div><div class="sk w80"></div><div class="sk w40"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    This is a stand-in page, not the real site — the sandbox has no internet.
    Everything enforcement-related above it is the real extension code.
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var host = params.get('host') || 'example.com';
      var tabId = Number(params.get('tab')) || null;
      window.__FF_TAB_ID = tabId;
      document.documentElement.dataset.ffTop = 'true';

      // The sandbox owns focus: there is no real browser chrome around this.
      window.__FF_DEMO_FOCUS = true;
      Object.defineProperty(document, 'hasFocus', { configurable: true, value: function () { return !!window.__FF_DEMO_FOCUS; } });
      Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return window.__FF_DEMO_FOCUS ? 'visible' : 'hidden'; } });

      var brandColors = {
        'youtube.com': '#e0483c', 'instagram.com': '#c13584', 'tiktok.com': '#111827',
        'x.com': '#111827', 'reddit.com': '#ff4500', 'facebook.com': '#1877f2',
        'twitch.tv': '#9146ff', 'netflix.com': '#e50914', 'discord.com': '#5865f2',
        'snapchat.com': '#fffc00', 'pinterest.com': '#e60023', 'tumblr.com': '#36465d',
        'wikipedia.org': '#1c4b8c'
      };
      var base = host.split('.').slice(-2).join('.');
      var brand = brandColors[base] || '#3f5a86';
      var pretty = (host.split('.').slice(0, -1).join('.') || host).replace(/[-_]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });

      document.documentElement.style.setProperty('--brand', brand);
      document.getElementById('logo').textContent = (pretty[0] || '?').toUpperCase();
      document.getElementById('name').textContent = pretty;
      document.getElementById('host').textContent = host;

      var side = document.getElementById('side');
      ['Home', 'Explore', 'Following', 'Saved', 'Messages', 'Settings'].forEach(function (label) {
        var div = document.createElement('div');
        div.className = 'nav-item';
        div.innerHTML = '<span class="dot"></span>' + label;
        side.appendChild(div);
      });

      var feed = document.getElementById('feed');
      for (var i = 0; i < 3; i++) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-head"><div class="avatar"></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;flex:1">' +
          '<div class="sk w40"></div><div class="sk w60"></div></div></div>' +
          (i === 0 ? '<div class="thumb"></div>' : '') +
          '<div class="card-body"><div class="sk w80"></div><div class="sk w60"></div><div class="sk w40"></div></div>';
        feed.appendChild(card);
      }

      // Build a chrome.* that proxies to the sandbox top window, then load the
      // REAL content script, exactly as the manifest would inject it.
      function boot() {
        window.chrome = window.parent.__FF_TAB_CHROME__(tabId);
        var s = document.createElement('script');
        s.src = '/extension/content.js';
        document.documentElement.appendChild(s);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
