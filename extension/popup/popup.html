<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FocusFrost</title>
  <link rel="stylesheet" href="../assets/ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup">
  <main id="app" class="frost-in">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a9e6ff" />
              <stop offset="1" stop-color="#4a9df5" />
            </linearGradient>
          </defs>
          <path d="M16 2 L27 7 v9c0 7-5 12-11 14C10 28 5 23 5 16V7z" fill="url(#g1)" opacity="0.22" />
          <path d="M16 2 L27 7 v9c0 7-5 12-11 14C10 28 5 23 5 16V7z" fill="none" stroke="url(#g1)" stroke-width="1.6" />
          <path d="M16 10v12M11 13.5l10 5M21 13.5l-10 5" stroke="#dff4ff" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <div class="brand-text">
          <h1>FocusFrost</h1>
          <span id="tagline" class="dim tiny">One tab. One task. One clock.</span>
        </div>
      </div>
      <div class="row">
        <label class="switch" title="Turn FocusFrost on or off entirely">
          <input type="checkbox" id="master" />
          <span></span>
        </label>
        <button class="icon-btn" id="settings" title="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18" />
          </svg>
        </button>
      </div>
    </header>

    <!-- live state -->
    <section class="hero card">
      <div class="hero-main">
        <svg class="hero-ring" viewBox="0 0 84 84" aria-hidden="true">
          <circle class="track" cx="42" cy="42" r="35" stroke-width="5" />
          <circle id="heroMeter" class="meter" cx="42" cy="42" r="35" stroke-width="5" />
        </svg>
        <div class="hero-text">
          <div id="heroLabel" class="hero-label">Idle</div>
          <div id="heroClock" class="hero-clock mono">—</div>
          <div id="heroSub" class="hero-sub dim">No tracked site open.</div>
        </div>
      </div>
      <div class="hero-meta">
        <span id="pauseChip" class="badge off">Not paused</span>
        <span id="usageChip" class="badge off">0 pauses today</span>
      </div>
    </section>

    <!-- pause -->
    <section class="card pause-card">
      <div class="spread">
        <div>
          <h2 class="h2">Need the site for real?</h2>
          <p class="small muted">Pick a window, then hold to unlock. It turns itself back on.</p>
        </div>
      </div>

      <div class="presets" id="presets" role="radiogroup" aria-label="Pause length"></div>

      <button id="holdBtn" class="hold" type="button">
        <span class="hold-fill" id="holdFill"></span>
        <span class="hold-label" id="holdLabel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 5h2v14H9zM13 5h2v14h-2z" />
          </svg>
          Hold <b class="mono">6s</b> to pause
        </span>
        <span class="hold-tip" id="holdTip"></span>
      </button>

      <button id="resumeBtn" class="btn btn-primary wide hidden">Resume tracking now</button>
      <p id="pauseMsg" class="small dim pause-msg"></p>
    </section>

    <!-- sites -->
    <section class="sites">
      <div class="spread section-head">
        <h2 class="h2">Your sites</h2>
        <button id="editSites" class="btn btn-sm btn-ghost">Edit</button>
      </div>
      <ul id="siteList" class="site-list"></ul>
    </section>

    <footer class="foot">
      <div class="stat"><b id="statFocus" class="mono">0m</b><span>focused today</span></div>
      <div class="stat"><b id="statBlocked" class="mono">0</b><span>blocks today</span></div>
      <div class="stat"><b id="statTurnedAway" class="mono">0</b><span>turned away</span></div>
      <div class="foot-actions">
        <button id="dashboard" class="btn btn-sm btn-ghost">Dashboard →</button>
      </div>
    </footer>
  </main>

  <div id="toast" class="toast"></div>

  <script src="../shared/util.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/hold.js"></script>
  <script src="popup.js"></script>
</body>
</html>
